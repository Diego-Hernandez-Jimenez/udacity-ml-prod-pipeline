[project]
name = "starter"
version = "0.0.0"
description = "Starter code."
requires-python = ">=3.13"
dependencies = [
    # Web framework and server
    "fastapi==0.117.1",
    "uvicorn[standard]==0.36.0",
    # Data validation
    "pydantic==2.11.9",
    # HTTP clients
    "httpx==0.28.1",
    "requests==2.32.5",
    # Data science
    "pandas==2.3.2",
    "numpy==2.3.3",
    "scikit-learn==1.7.2",
    "joblib>=1.3",
    # Config and utilities
    "pyyaml>=6.0",
    "python-multipart==0.0.20",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "flake8==7.3.0",
    "marimo>=0.23.15",
    "ruff>=0.16.0",
    "altair>=4.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
