name: Code quality and testing analysis with flake8 and pytest
on:
  push:
    branches:
      - master

jobs:
  run-flake8-and-pytest:
    runs-on: ubuntu-latest

    steps:

      - name: checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv 
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.33"
          enable-cache: true
      
      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run flake8 analysis
        run: uv run flake8 app/src
      
      - name: Run tests
        run: uv run pytest app/tests

  
