repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: \.pkl$ # not ideal, in real setting large files like ml models would be stored remotely (using dvc)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^app/notebooks/.*\.py$ # we can be more tolerant with marimo notebooks
      - id: ruff-format
        exclude: ^app/notebooks/.*\.py$

# reference: https://pydevtools.com/handbook/how-to/how-to-set-up-pre-commit-hooks-for-a-python-project/
